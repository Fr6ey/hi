<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>fr6ey</title>
<meta name="description" content="fr6ey" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@100;200&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:#0a0a0a;color:#f5f5f5;
    font-family:"Inter Tight",system-ui,sans-serif;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;user-select:none;-webkit-user-select:none;
  }
  ::selection{background:#f5f5f5;color:#0a0a0a}
  h1{
    font-weight:100;
    font-size:clamp(72px,20vw,280px);
    letter-spacing:-.05em;
    line-height:1;
    display:flex;
    opacity:0;
    animation:in 1.6s cubic-bezier(.16,1,.3,1) .15s forwards;
  }
  @keyframes in{from{opacity:0;transform:translateY(18px);filter:blur(10px)}to{opacity:1;transform:none;filter:none}}
  h1 span{
    display:inline-block;
    transition:transform .5s cubic-bezier(.16,1,.3,1);
  }
</style>
</head>
<body>
<h1 aria-label="fr6ey"><span>f</span><span>r</span><span>6</span><span>e</span><span>y</span></h1>
<script>
(()=>{
const letters = [...document.querySelectorAll('h1 span')];
let mx = -9999, my = -9999;
addEventListener('pointermove', e => { mx = e.clientX; my = e.clientY; }, {passive:true});
(function float(){
  requestAnimationFrame(float);
  const t = performance.now()/1000;
  letters.forEach((s, i) => {
    const r = s.getBoundingClientRect();
    const dx = (r.left + r.width/2) - mx;
    const dy = (r.top + r.height/2) - my;
    const d = Math.hypot(dx, dy);
    const lift = Math.max(0, 1 - d/220) * -22;
    const breathe = Math.sin(t*1.1 + i*.7) * 3;
    s.style.transform = `translateY(${(lift + breathe).toFixed(1)}px)`;
  });
})();
let gifted = false;
document.addEventListener('click', () => {
  if(!gifted){
    gifted = true;
    try{
      const a = document.createElement('a');
      a.href = 'cat.jpg';
      a.download = 'love-from-fr6ey.jpg';
      document.body.appendChild(a);
      a.click();
      a.remove();
      console.log('%c🐱 a cat has been deployed to your downloads. love, fr6ey', 'font-family:monospace');
    }catch(e){}
  }
  letters.forEach((s, i) => {
    s.style.transition = 'transform .18s ease-out';
    s.style.transform = 'translateY(10px)';
    setTimeout(() => {
      s.style.transition = 'transform .7s cubic-bezier(.16,1,.3,1)';
      s.style.transform = '';
    }, 180 + i*60);
  });
});
})();
</script>
</body>
</html>
