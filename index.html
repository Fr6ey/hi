function complete(){
  const v = termIn.value;
  const sp = v.lastIndexOf(' ');
  if(sp === -1){
    const names = Object.keys(SH).filter(n => n.indexOf(v) === 0);
    if(names.length === 1) termIn.value = names[0] + ' ';
    else if(names.length > 1) tprint(names.map(esc).join('   '));
    return;
  }
  const head = v.slice(0, sp+1), frag = v.slice(sp+1);
  const sl = frag.lastIndexOf('/');
  const dirFrag = sl === -1 ? '' : frag.slice(0, sl+1);
  const base = sl === -1 ? frag : frag.slice(sl+1);
  const dir = vget(norm(cwd, dirFrag || '.'));
  if(!dir || dir.t !== 'd') return;
  const opts = Object.keys(dir.k).filter(n => n.indexOf(base) === 0);
  if(opts.length === 1){
    const o = opts[0];
    termIn.value = head + dirFrag + o + (dir.k[o].t === 'd' ? '/' : ' ');
  }

termIn.addEventListener('keydown', e => {

  if(e.key === 'Escape'){ closeTerm(); return; }
  if(e.key === 'ArrowUp'){ e.preventDefault(); if(hi > 0){ hi--; termIn.value = hist[hi] || ''; } return; }
  if(e.key === 'ArrowDown'){ e.preventDefault(); if(hi < hist.length){ hi++; termIn.value = hist[hi] || ''; } return; }
  if(e.key === 'Tab'){ e.preventDefault(); complete(); return; }
  if(e.key !== 'Enter') return;
  const raw = termIn.value;
  termIn.value = '';
  hist.push(raw); hi = hist.length;

// matrix rain, 6 seconds
let raining = false;
function rain(){
  if(raining) return;
  raining = true;
  const cv = document.getElementById('mrain');
  cv.classList.add('on');
  cv.width = innerWidth; cv.height = innerHeight;
  const cx = cv.getContext('2d');
  const cols = Math.floor(innerWidth/16);
  const drops = [];
  for(let i = 0; i < cols; i++) drops.push(Math.random()*-50);
  const glyphs = 'fr6ey01<>[]#$+'.split('');
  const end = performance.now() + 6000;
  (function frame(){
    cx.fillStyle = 'rgba(0,0,0,0.12)';
    cx.fillRect(0, 0, cv.width, cv.height);
    cx.font = '15px monospace';
    for(let i = 0; i < cols; i++){
      const g = glyphs[(Math.random()*glyphs.length)|0];
      cx.fillStyle = Math.random() < .04 ? '#fff' : '#00e065';
      cx.fillText(g, i*16, drops[i]*16);
      if(drops[i]*16 > cv.height && Math.random() > .976) drops[i] = 0;
      drops[i]++;
    }
    if(performance.now() < end) requestAnimationFrame(frame);
    else{ cv.classList.remove('on'); raining = false; }
  })();
}
